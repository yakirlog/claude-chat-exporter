name: Check upstream exporter

on:
  workflow_dispatch:

  schedule:
    # Daily at 06:17 UTC.
    # Using a non-round minute reduces the chance of GitHub scheduler delays.
    - cron: "17 6 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_URL: https://raw.githubusercontent.com/agarwalvishal/claude-chat-exporter/main/claude-chat-exporter.js
      LOCAL_URL: https://raw.githubusercontent.com/yakirlog/claude-chat-exporter/main/claude-chat-exporter.js
      ISSUE_TITLE: "Upstream claude-chat-exporter.js changed"

    steps:
      - name: Download upstream and fork versions
        run: |
          curl --fail --silent --show-error \
            "$UPSTREAM_URL" \
            --output upstream.js

          curl --fail --silent --show-error \
            "$LOCAL_URL" \
            --output local.js

      - name: Compare files
        id: compare
        run: |
          if cmp --silent upstream.js local.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Files are identical."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Upstream exporter has changed."
          fi

      - name: Create notification issue
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing_issue="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$ISSUE_TITLE in:title" \
              --json number,title \
              --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" \
              | head -n 1
          )"

          if [ -n "$existing_issue" ]; then
            echo "Notification issue already exists: #$existing_issue"
            exit 0
          fi

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$ISSUE_TITLE" \
            --body "$(cat <<'EOF'
          The upstream `claude-chat-exporter.js` differs from the version currently stored in this fork.

          Upstream:
          https://github.com/agarwalvishal/claude-chat-exporter/blob/main/claude-chat-exporter.js

          Compare:
          https://github.com/yakirlog/claude-chat-exporter/compare/main...agarwalvishal:claude-chat-exporter:main

          ## Update workflow

          1. Review the upstream changes.
          2. Sync the fork with upstream.
          3. Confirm that the exporter still ends with:

             ```javascript
             setupClaudeExporter();
             ```

          4. Rebuild the userscript:

             ```bash
             node build-userscript.mjs <new-version>
             ```

          5. Test the generated userscript in Tampermonkey.
          6. Commit the regenerated `claude-chat-exporter.user.js`.
          7. Close this issue.
          EOF
          )"
          
